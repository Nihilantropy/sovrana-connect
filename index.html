<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SovranaConnect</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <!-- Splash: shown while resolving the config + first probe. -->
    <main id="splash" class="screen" aria-busy="true">
      <img class="wordmark" src="/src/assets/sovranaai-wordmark.png" alt="SovranaAI" />
      <div class="spinner" role="status" aria-label="Connessione in corso"></div>
    </main>

    <!-- Launcher: one tile per suite service (D37). Built by main.ts. -->
    <main id="launcher" class="screen launcher hidden">
      <header class="launcher-header">
        <img class="wordmark wordmark-small" src="/src/assets/sovranaai-wordmark.png" alt="SovranaAI" />
        <p class="launcher-subtitle" id="launcher-subtitle">I tuoi servizi</p>
      </header>
      <div class="tiles" id="tiles"></div>
    </main>

    <!-- Error: single-service config and that endpoint is unreachable. -->
    <main id="error" class="screen hidden">
      <img class="wordmark" src="/src/assets/sovranaai-wordmark.png" alt="SovranaAI" />
      <p class="error-title">Servizio non raggiungibile</p>
      <p class="error-endpoint" id="error-endpoint"></p>
      <button id="retry" class="btn-accent" type="button">Riprova</button>
    </main>
  </body>
</html>
