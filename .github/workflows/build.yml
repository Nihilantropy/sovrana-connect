name: build

# Tauri compiles a native binary per OS, so CI fans out across OS runners.
# Cost control (private repo, billed minutes — Linux 1x / Windows 2x / macOS 10x):
#   - push to main  -> Linux + Windows compile-sanity only  (~24 billed min)
#   - tag v*        -> adds the 10x macOS job + drafts a GitHub Release with the
#                      real artifacts (.exe NSIS + .dmg). ~124 billed min.
# Delivery targets are Windows + macOS (D35). The Linux job is an off-target
# compile gate only (no shipped artifact); drop it if you want to save the 1x.

on:
  push:
    branches: [main]      # compile-sanity, no release
    tags: ['v*']          # full bundles + GitHub Release
  pull_request:
  workflow_dispatch:       # manual build button (zero auto-burn)

# Kill superseded runs on rapid pushes so we never double-spend minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write       # tauri-action needs this to create the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest          # real artifact: NSIS .exe
            args: ''
          - platform: ubuntu-latest           # off-target compile gate (D35)
            args: ''
          - platform: macos-latest            # real artifact: .dmg (Apple Silicon)
            args: '--target aarch64-apple-darwin'
    # Skip the 10x macOS job unless this is a v* tag.
    if: matrix.platform != 'macos-latest' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Release only on a v* tag; a plain push builds but ships nothing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'SovranaConnect ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
